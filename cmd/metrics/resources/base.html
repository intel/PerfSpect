<!DOCTYPE html>
<html lang="en">

<head>
  <title>Intel&reg; PerfSpect</title>
  <link rel="icon" type="image/x-icon" href="https://www.intel.com/favicon.ico" />
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, width=device-width" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5.16.7/umd/material-ui.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.3.3/echarts.min.js"
    integrity="sha512-2L0h0GhoIHQEjti/1KwfjcbyaTHy+hPPhE1o5wTCmviYcPO/TD9oZvUxFQtWvBkCSTIpt+fjsx1CCx6ekb51gw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Fonts to support Material Design -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
  <!-- Icons to support Material Design -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const {
      colors,
      CssBaseline,
      ThemeProvider,
      Container,
      createTheme,
      Typography,
      Button,
      IconButton,
      ButtonGroup,
      Slider,
      Grid,
      Box,
      Tab,
      Dialog,
      Alert,
      Snackbar,
      Link,
      Tabs,
      TextField,
      Icon,
      Table,
      TableBody,
      TableCell,
      TableContainer,
      TableHead,
      TableRow,
      Tooltip,
      Paper,
    } = MaterialUI;

    // Create a theme instance.
    const theme = createTheme({
      typography: {
        fontSize: 14,
        h2: {
          fontSize: "2.5rem",
        },
        fontFamily: [
          "-apple-system",
          "BlinkMacSystemFont",
          '"Segoe UI"',
          "Roboto",
          '"Helvetica Neue"',
          "Arial",
          "sans-serif",
          '"Apple Color Emoji"',
          '"Segoe UI Emoji"',
          '"Segoe UI Symbol"',
        ].join(","),
      },
      palette: {
        mode: 'light',
      },
    });

    function ReactECharts({ option, style, settings, loading, theme }) {
      const chartRef = React.useRef("null");

      React.useEffect(() => {
        // Initialize chart
        let chart;
        if (chartRef.current !== null) {
          chart = echarts.init(chartRef.current, theme);
        }

        // Add chart resize listener
        // ResizeObserver is leading to a bit janky UX
        function resizeChart() {
          chart.resize();
        }
        window.addEventListener("resize", resizeChart);

        // Return cleanup function
        return () => {
          chart.dispose();
          window.removeEventListener("resize", resizeChart);
        };
      }, [theme]);

      React.useEffect(() => {
        // Update chart
        if (chartRef.current !== null) {
          const chart = echarts.getInstanceByDom(chartRef.current);
          chart.setOption(option, settings);
        }
      }, [option, settings, theme]); // Whenever theme changes we need to add option and setting due to it being deleted in cleanup function

      React.useEffect(() => {
        // Update chart
        if (chartRef.current !== null) {
          const chart = echarts.getInstanceByDom(chartRef.current);
          // eslint-disable-next-line @typescript-eslint/no-unused-expressions
          loading === true ? chart.showLoading() : chart.hideLoading();
        }
      }, [loading, theme]);

      return (
        <div
          ref={chartRef}
          style={{ width: "100%", height: "100%", ...style }}
        />
      );
      }

    function TabPanel(props) {
      const { children, value, index, ...other } = props;

      return (
        <div
          role="tabpanel"
          hidden={value !== index}
          id={`simple-tabpanel-${index}`}
          aria-labelledby={`simple-tab-${index}`}
          {...other}
        >
          {value === index && (
            <div style={{ height: "100%" }}>{children}</div>
          )}
        </div>
      );
    }

    function getGroupLabels(groupByField) {
      return {
        SKT: { tab: "Per-Socket Metrics", singular: "socket", plural: "sockets" },
        CPU: { tab: "Per-CPU Metrics", singular: "CPU", plural: "CPUs" },
        CID: { tab: "Per-Cgroup Metrics", singular: "cgroup", plural: "cgroups" },
        CONTAINER: { tab: "Per-Container Metrics", singular: "container", plural: "containers" },
      }[groupByField] || { tab: "Per-Group Metrics", singular: "group", plural: "groups" };
    }

    // MetricName component - the name, preceded by an info button with its description
    // and, for TMA metrics, indentation showing the metric's level
    function MetricName({ name, level, description, infoTooltipProps }) {
      const indentationLevel = level > 1 ? level - 1 : 0;
      const hasDesc = Boolean(description && Object.prototype.hasOwnProperty.call(description, name));
      return (
        <React.Fragment>
          <Tooltip
            title={hasDesc ? description[name] : ""}
            componentsProps={infoTooltipProps}
          >
            <IconButton sx={{ padding: "0 8px 0 0" }} disabled={!hasDesc}>
              <Icon>info</Icon>
            </IconButton>
          </Tooltip>
          {indentationLevel > 0 &&
            <span style={{
              paddingLeft: `${indentationLevel * 16}px`,
              borderLeft: '1px dotted #aaa',
              marginLeft: '4px',
            }}>
              <Icon
                sx={{
                  fontSize: '0.8rem',
                  verticalAlign: 'middle',
                  color: '#666',
                  marginRight: '4px'
                }}
              >
                subdirectory_arrow_right
              </Icon>
            </span>
          }
          {name}
        </React.Fragment>
      );
    }

    // Group values can be long, e.g., cgroup paths; the full value is in the tooltip.
    // Container display names preserve namespace/pod/name identity, so keep the full string.
    function shortGroupName(groupByField, value) {
      if (groupByField === "CONTAINER") {
        return value.length > 28 ? value.slice(0, 25) + "..." : value;
      }
      const leaf = value.split("/").filter(Boolean).pop() || value;
      return leaf.length > 28 ? leaf.slice(0, 25) + "..." : leaf;
    }

    function orderContainerGroupIndices(groups, groupMeta, hasPodInfo) {
      const orderedIndices = [];
      if (!hasPodInfo) {
        for (let i = 0; i < groups.length; i++) {
          orderedIndices.push(i);
        }
        return orderedIndices;
      }
      // Group contiguously by namespace first, then by workload within each namespace,
      // preserving first-seen order at each level.
      const nsOrder = [];
      const wlOrderByNs = {};
      const indicesByWl = {};
      for (let i = 0; i < groups.length; i++) {
        const m = groupMeta[i] || {};
        const nsKey = m.podName ? ("ns|" + (m.namespace || "")) : "__standalone__";
        const wlKey = m.podName
          ? ((m.namespace || "") + "|" + (m.workload || m.podName))
          : ("__standalone__|" + String(i));
        if (!Object.prototype.hasOwnProperty.call(wlOrderByNs, nsKey)) {
          wlOrderByNs[nsKey] = [];
          nsOrder.push(nsKey);
        }
        if (!Object.prototype.hasOwnProperty.call(indicesByWl, wlKey)) {
          indicesByWl[wlKey] = [];
          wlOrderByNs[nsKey].push(wlKey);
        }
        indicesByWl[wlKey].push(i);
      }
      nsOrder.forEach(function(nsKey) {
        wlOrderByNs[nsKey].forEach(function(wlKey) {
          indicesByWl[wlKey].forEach(function(idx) {
            orderedIndices.push(idx);
          });
        });
      });
      return orderedIndices;
    }

    function buildContainerRollupGroups(orderedIndices, groups, groupMeta) {
      const rollupGroups = [];
      const rollupByKey = {};
      orderedIndices.forEach(function(idx) {
        const m = groupMeta[idx] || {};
        const cName = m.name || groups[idx][0];
        const nsKey = m.podName ? ("ns|" + (m.namespace || "")) : "__standalone__";
        const wlKey = m.podName
          ? ((m.namespace || "") + "|" + (m.workload || m.podName))
          : ("__standalone__|" + String(idx));
        const rk = m.podName
          ? ((m.namespace || "") + "|" + (m.workload || m.podName || cName) + "|" + cName)
          : ("__standalone__|" + String(idx));
        if (!Object.prototype.hasOwnProperty.call(rollupByKey, rk)) {
          const entry = {
            key: rk,
            nsKey: nsKey,
            wlKey: wlKey,
            name: cName,
            namespace: m.namespace || "",
            workload: m.workload || m.podName || cName,
            runtime: m.runtime || "",
            hasPod: Boolean(m.podName),
            memberIndices: [],
          };
          rollupByKey[rk] = entry;
          rollupGroups.push(entry);
        }
        rollupByKey[rk].memberIndices.push(idx);
      });
      return rollupGroups;
    }

    function buildGroupDisplayColumns(groupByField, groups, groupMeta, orderedIndices, rollupGroups, hasPodInfo, isGroupedView) {
      if (!hasPodInfo) {
        return orderedIndices.map(function(idx) {
          const g = groups[idx];
          const value = g[0];
          const sampleCount = g[1];
          const cgroupPath = g[2];
          return {
            key: value,
            nsKey: "",
            nsLabel: "",
            wlKey: "",
            wlLabel: "",
            isNsStart: false,
            isSpanStart: false,
            line1: shortGroupName(groupByField, value),
            line2: "",
            tooltip: cgroupPath
              ? `${value} (${cgroupPath}, ${sampleCount} sample${sampleCount === "1" ? "" : "s"})`
              : `${value} (${sampleCount} sample${sampleCount === "1" ? "" : "s"})`,
            memberIndices: [idx],
          };
        });
      }
      if (isGroupedView) {
        return rollupGroups.map(function(rg) {
          const podCount = rg.memberIndices.length;
          let totalSamples = 0;
          const memberPods = [];
          rg.memberIndices.forEach(function(idx) {
            const s = Number(groups[idx][1]);
            if (Number.isFinite(s)) {
              totalSamples += s;
            }
            const mm = groupMeta[idx] || {};
            memberPods.push(mm.podName || groups[idx][0]);
          });
          const nsLabel = rg.hasPod ? (rg.namespace || "—") : "standalone";
          const wlLabel = rg.hasPod ? rg.workload : (rg.runtime || "standalone");
          let line2 = "";
          let tooltip = "";
          if (podCount === 1) {
            const idx = rg.memberIndices[0];
            const g = groups[idx];
            const mm = groupMeta[idx] || {};
            const shortPod = mm.shortPod || mm.podName || "";
            const cgroupPath = g[2] || mm.cgroupPath || "";
            if (mm.podName) {
              line2 = (shortPod && shortPod !== rg.workload) ? shortPod : "";
              const fullName = mm.namespace ? `${mm.namespace}/${mm.podName}/${rg.name}` : `${mm.podName}/${rg.name}`;
              tooltip = cgroupPath
                ? `${fullName} (${cgroupPath}, ${g[1]} sample${g[1] === "1" ? "" : "s"})`
                : `${fullName} (${g[1]} sample${g[1] === "1" ? "" : "s"})`;
            } else {
              line2 = "";
              tooltip = cgroupPath
                ? `${g[0]} (${cgroupPath}, ${g[1]} sample${g[1] === "1" ? "" : "s"})`
                : `${g[0]} (${g[1]} sample${g[1] === "1" ? "" : "s"})`;
            }
          } else {
            line2 = `${podCount} pods`;
            const prefix = rg.namespace ? `${rg.namespace}/${rg.workload}/${rg.name}` : `${rg.workload}/${rg.name}`;
            tooltip = `${prefix} (${podCount} pods: ${memberPods.join(", ")}; ${totalSamples} total sample${totalSamples === 1 ? "" : "s"})`;
          }
          return {
            key: `grp-${rg.key}`,
            nsKey: rg.nsKey,
            nsLabel: nsLabel,
            wlKey: rg.wlKey,
            wlLabel: wlLabel,
            isNsStart: false,
            isSpanStart: false,
            line1: rg.name,
            line2: line2,
            tooltip: tooltip,
            memberIndices: rg.memberIndices,
          };
        });
      }
      return orderedIndices.map(function(idx) {
        const g = groups[idx];
        const value = g[0];
        const sampleCount = g[1];
        const mm = groupMeta[idx] || {};
        const cName = mm.name || value;
        const podName = mm.podName || "";
        const shortPod = mm.shortPod || podName;
        const ns = mm.namespace || "";
        const wl = mm.workload || podName || cName;
        const cgroupPath = g[2] || mm.cgroupPath || "";
        const nsKey = podName ? ("ns|" + ns) : "__standalone__";
        const nsLabel = podName ? (ns || "—") : "standalone";
        const wlLabel = podName ? wl : (mm.runtime || "standalone");
        const line2 = podName
          ? ((shortPod && shortPod !== wl) ? shortPod : "")
          : "";
        const fullName = podName
          ? (ns ? `${ns}/${podName}/${cName}` : `${podName}/${cName}`)
          : value;
        const tooltip = cgroupPath
          ? `${fullName} (${cgroupPath}, ${sampleCount} sample${sampleCount === "1" ? "" : "s"})`
          : `${fullName} (${sampleCount} sample${sampleCount === "1" ? "" : "s"})`;
        return {
          key: `ind-${idx}-${value}`,
          nsKey: nsKey,
          nsLabel: nsLabel,
          wlKey: podName ? ((ns || "") + "|" + wl) : ("__standalone__|" + String(idx)),
          wlLabel: wlLabel,
          isNsStart: false,
          isSpanStart: false,
          line1: cName,
          line2: line2,
          tooltip: tooltip,
          memberIndices: [idx],
        };
      });
    }

    function buildGroupHeaderSpans(displayColumns, hasPodInfo) {
      const nsSpans = [];
      const wlSpans = [];
      if (!hasPodInfo) {
        return { nsSpans: nsSpans, wlSpans: wlSpans };
      }
      displayColumns.forEach(function(col, idx) {
        const lastNs = nsSpans.length > 0 ? nsSpans[nsSpans.length - 1] : null;
        if (lastNs && lastNs.nsKey === col.nsKey) {
          lastNs.count += 1;
        } else {
          col.isNsStart = true;
          nsSpans.push({
            nsKey: col.nsKey,
            label: col.nsLabel,
            count: 1,
            key: `ns-${idx}-${col.nsKey}`,
          });
        }
        const lastWl = wlSpans.length > 0 ? wlSpans[wlSpans.length - 1] : null;
        if (lastWl && lastWl.wlKey === col.wlKey) {
          lastWl.count += 1;
        } else {
          col.isSpanStart = true;
          wlSpans.push({
            wlKey: col.wlKey,
            label: col.wlLabel,
            isNsStart: col.isNsStart,
            count: 1,
            key: `wl-${idx}-${col.wlKey}`,
          });
        }
      });
      return { nsSpans: nsSpans, wlSpans: wlSpans };
    }

    function formatGroupConfigCell(row, col) {
      if (col.memberIndices.length === 1) {
        const v = row[col.memberIndices[0] + 2];
        return v === "" || v === undefined ? "—" : v;
      }
      const distinct = [];
      const seen = {};
      col.memberIndices.forEach(function(idx) {
        const v = row[idx + 2];
        if (v === "" || v === undefined) {
          return;
        }
        if (!Object.prototype.hasOwnProperty.call(seen, v)) {
          seen[v] = true;
          distinct.push(v);
        }
      });
      if (distinct.length === 0) {
        return "—";
      }
      if (distinct.length === 1) {
        return distinct[0];
      }
      if (distinct.length <= 2) {
        return distinct.join(", ");
      }
      return "mixed";
    }

    function formatGroupMetricCell(row, col, groups) {
      if (col.memberIndices.length === 1) {
        const v = row[col.memberIndices[0] + 2];
        if (v === "" || v === undefined || !Number.isFinite(Number(v))) {
          return "—";
        }
        return Number(v).toFixed(4);
      }
      let weightedSum = 0;
      let totalWeight = 0;
      col.memberIndices.forEach(function(idx) {
        const raw = row[idx + 2];
        if (raw === "" || raw === undefined) {
          return;
        }
        const val = Number(raw);
        if (!Number.isFinite(val)) {
          return;
        }
        const rawCount = Number(groups[idx][1]);
        const weight = Number.isFinite(rawCount) && rawCount > 0 ? rawCount : 1;
        weightedSum += val * weight;
        totalWeight += weight;
      });
      if (totalWeight === 0) {
        return "—";
      }
      return (weightedSum / totalWeight).toFixed(4);
    }

    // GroupMeansTable component - one row per metric, one column per group, e.g., per
    // cgroup or container, holding that group's mean over the collection
    function GroupMeansTable({
      groupByField,
      groups,
      groupMeans,
      groupConfigs,
      groupMeta,
      description,
      containerViewMode,
      setContainerViewMode,
      infoTooltipProps,
    }) {
      const nsRowRef = React.useRef(null);
      const wlRowRef = React.useRef(null);
      const [nsRowHeight, setNsRowHeight] = React.useState(30);
      const [wlRowHeight, setWlRowHeight] = React.useState(30);

      const groupLabels = getGroupLabels(groupByField);
      const isContainerMode = groupByField === "CONTAINER" && Array.isArray(groupMeta) && groupMeta.length === groups.length;
      const hasPodInfo = isContainerMode && groupMeta.some(function(m) { return Boolean(m && m.podName); });
      const hasNamespace = hasPodInfo && groupMeta.some(function(m) { return Boolean(m && m.namespace); });

      const orderedIndices = orderContainerGroupIndices(groups, groupMeta, hasPodInfo);
      const rollupGroups = hasPodInfo ? buildContainerRollupGroups(orderedIndices, groups, groupMeta) : [];
      const showToggle = hasPodInfo && rollupGroups.length < groups.length;
      const isGroupedView = showToggle && containerViewMode === "grouped";

      React.useEffect(() => {
        if (nsRowRef.current) {
          const h = nsRowRef.current.getBoundingClientRect().height;
          if (h > 0) {
            setNsRowHeight(h);
          }
        }
        if (wlRowRef.current) {
          const h = wlRowRef.current.getBoundingClientRect().height;
          if (h > 0) {
            setWlRowHeight(h);
          }
        }
      }, [hasPodInfo, hasNamespace, isGroupedView, groups.length]);

      const displayColumns = buildGroupDisplayColumns(groupByField, groups, groupMeta, orderedIndices, rollupGroups, hasPodInfo, isGroupedView);
      const headerSpans = buildGroupHeaderSpans(displayColumns, hasPodInfo);
      const nsSpans = headerSpans.nsSpans;
      const wlSpans = headerSpans.wlSpans;
      const wlRowTop = hasNamespace ? nsRowHeight : 0;
      const colRowTop = wlRowTop + wlRowHeight;

      const captionText = isGroupedView
        ? `Mean value of each metric (weighted average per container across member pods, weighted by sample count) for ${groups.length} containers into ${displayColumns.length} workload container group${displayColumns.length === 1 ? "" : "s"}. Hover over a column heading for member pods and cgroup details. A dash indicates that no valid samples were collected for the metric.`
        : (groups.length === 1
          ? `Mean value of each metric for the ${groupLabels.singular} monitored during the collection period. Hover over a column heading for its full name and the number of samples collected for it. A dash indicates that no valid samples were collected for the metric.`
          : `Mean value of each metric for each of the ${groups.length} ${groupLabels.plural} monitored during the collection period. Hover over a column heading for its full name and the number of samples collected for it. A dash indicates that no valid samples were collected for the metric.`);

      // keep the metric name visible while scrolling the group columns horizontally
      const stickyCell = {
        position: "sticky",
        left: 0,
        backgroundColor: "background.paper",
      };
      return (
        <React.Fragment>
          <Typography variant="body1" sx={{ paddingBottom: showToggle ? "12px" : "16px" }}>
            {captionText}
          </Typography>
          {showToggle && (
            <Box sx={{ paddingBottom: "12px" }}>
              <ButtonGroup size="small" aria-label="Container grouping mode">
                <Button
                  variant={containerViewMode === "individual" ? "contained" : "outlined"}
                  onClick={() => setContainerViewMode("individual")}
                >
                  {`Individual (${groups.length})`}
                </Button>
                <Button
                  variant={containerViewMode === "grouped" ? "contained" : "outlined"}
                  onClick={() => setContainerViewMode("grouped")}
                >
                  {`Grouped by Workload (${rollupGroups.length})`}
                </Button>
              </ButtonGroup>
            </Box>
          )}
          <TableContainer component={Paper} sx={{ maxHeight: "80vh", overflow: "auto" }}>
            <Table size="small" stickyHeader style={{ tableLayout: 'auto', width: "auto" }}>
              <TableHead>
                {hasPodInfo ? (
                  <React.Fragment>
                    {hasNamespace && (
                      <TableRow ref={nsRowRef}>
                        <TableCell
                          sx={{
                            ...stickyCell,
                            top: 0,
                            zIndex: 4,
                            height: 30,
                            boxSizing: "border-box",
                            lineHeight: "18px",
                            backgroundColor: "grey.200",
                            fontWeight: 600,
                            fontSize: "0.78rem",
                            color: "text.secondary",
                            py: 0.5,
                            whiteSpace: "nowrap",
                          }}
                        >
                          Namespace
                        </TableCell>
                        {nsSpans.map((span, idx) => (
                          <TableCell
                            key={span.key}
                            colSpan={span.count}
                            align="center"
                            sx={{
                              top: 0,
                              zIndex: 3,
                              height: 30,
                              boxSizing: "border-box",
                              lineHeight: "18px",
                              backgroundColor: "grey.200",
                              borderLeft: idx > 0 ? "2px solid" : "1px solid",
                              borderColor: "divider",
                              fontWeight: 600,
                              fontFamily: "Monospace",
                              fontSize: "0.78rem",
                              py: 0.5,
                              whiteSpace: "nowrap",
                            }}
                          >
                            {span.count > 1 ? `${span.label} (${span.count})` : span.label}
                          </TableCell>
                        ))}
                      </TableRow>
                    )}
                    <TableRow ref={wlRowRef}>
                      <TableCell
                        sx={{
                          ...stickyCell,
                          top: wlRowTop,
                          zIndex: 4,
                          height: 30,
                          boxSizing: "border-box",
                          lineHeight: "18px",
                          backgroundColor: "grey.100",
                          fontWeight: 600,
                          fontSize: "0.78rem",
                          color: "text.secondary",
                          py: 0.5,
                          whiteSpace: "nowrap",
                        }}
                      >
                        Workload
                      </TableCell>
                      {wlSpans.map((span, idx) => (
                        <TableCell
                          key={span.key}
                          colSpan={span.count}
                          align="center"
                          sx={{
                            top: wlRowTop,
                            zIndex: 3,
                            height: 30,
                            boxSizing: "border-box",
                            lineHeight: "18px",
                            backgroundColor: "grey.100",
                            borderLeft: (span.isNsStart && idx > 0) ? "2px solid" : "1px solid",
                            borderColor: "divider",
                            fontWeight: 600,
                            fontFamily: "Monospace",
                            fontSize: "0.78rem",
                            py: 0.5,
                            whiteSpace: "nowrap",
                          }}
                        >
                          {span.count > 1 ? `${span.label} (${span.count})` : span.label}
                        </TableCell>
                      ))}
                    </TableRow>
                    <TableRow>
                      <TableCell sx={{ ...stickyCell, top: colRowTop, zIndex: 4, verticalAlign: "bottom" }}>
                        Metric
                      </TableCell>
                      {displayColumns.map((col, idx) => (
                        <TableCell
                          key={col.key}
                          align="right"
                          sx={{
                            top: colRowTop,
                            zIndex: 3,
                            backgroundColor: "background.paper",
                            borderLeft: (col.isNsStart && idx > 0) ? "2px solid" : (col.isSpanStart ? "1px solid" : undefined),
                            borderColor: col.isSpanStart ? "divider" : undefined,
                            verticalAlign: "bottom",
                          }}
                        >
                          <Tooltip title={col.tooltip} componentsProps={infoTooltipProps}>
                            <Box sx={{ display: "inline-block", textAlign: "right", cursor: "help" }}>
                              <Box
                                component="span"
                                sx={{
                                  display: "block",
                                  fontFamily: "Monospace",

        let reader = new FileReader();
        reader.onload = (e) => {
          let new_metrics = JSON.parse(e.target.result.split("\n").filter(e => e.includes("const all_metrics ="))[0].split("const all_metrics =")[1])
          let copy = JSON.parse(JSON.stringify(current_metrics))
          let temp_mindiff = 0
          let temp_maxdiff = 0
          for (const metric of copy) {
            for (const other_metric of new_metrics) {
              if (metric[0] === other_metric[0]) {
                metric.other = other_metric[1]
                if (other_metric[1] < metric[1]) {
                  metric.diff = ((other_metric[1] / metric[1]) - 1) * 100
                } else {
                  metric.diff = ((metric[1] / other_metric[1]) - 1) * -100
                }
                if (temp_maxdiff == 0 || temp_maxdiff < metric.diff) {
                  temp_maxdiff = metric.diff
                }
                if (temp_mindiff == 0 || temp_mindiff > metric.diff) {

                  </ul>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "400px" }} option={tmasunburst} />
                </Grid>
              </Grid>
              <Grid container style={{ borderBottom: "1px solid rgba(0, 0, 0, 0.1)", paddingBottom: "24px" }}>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    Level 1 TMA Metrics Over Time
                  </Typography>
                  <Typography variant="body1">
                    Here, we show the TMA Frontend, Backend, Retiring and Bad Speculation percentages over the collection period.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={level1tma} />
                </Grid>
              </Grid>
              <Grid container style={{ paddingTop: "24px" }}>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    All TMA Metrics
                  </Typography>
                  <Typography variant="body1">
                    List of all collected Top-down Microarchitecture Analysis metrics.
                  </Typography>
                </Grid>
                <Grid item xs={7} sx={{ display: 'flex', justifyContent: 'center' }}>
                  <MetricsTable 
                    data={current_metrics}
                    filterPrefix={<<.TMAFILTER>>}
                    containerStyle={{ height: "500px", overflow: "auto", width: "fit-content" }}
                  />
                </Grid>
              </Grid>
            </TabPanel>
            <TabPanel
              value={systemTabs}
              index={tabIndex.cpu}
            >
              <Grid container style={{ borderBottom: "1px solid rgba(0, 0, 0, 0.1)", paddingBottom: "24px" }}>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    CPU Utilization
                  </Typography>
                  <Typography variant="body1">
                    Percentage of time spent in the active CPU power state C0. When a core is not being utilized it can go into lower power states to reduce idle energy consumption. Higher CPU utilization generally indicates that the system is being effectively used, but very high utilization (e.g., consistently above 80-90%) may lead to performance bottlenecks if the CPU becomes a limiting factor for application performance.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={cpu_util} />
                </Grid>
              </Grid>
              <Grid container style={{ borderBottom: "1px solid rgba(0, 0, 0, 0.1)", paddingBottom: "24px" }}>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    CPU Utilization in Kernel Mode
                  </Typography>
                  <Typography variant="body1">
                    The percentage of CPU time spent executing system-level operations, such as handling hardware interrupts and running operating system kernel code, rather than user-level applications. This metric helps identify if high CPU usage is due to system overhead or application demands.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={kernel_util} />
                </Grid>
              </Grid>
              <Grid container style={{ borderBottom: "1px solid rgba(0, 0, 0, 0.1)", paddingBottom: "24px" }}>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    CPI
                  </Typography>
                  <Typography variant="body1">
                    Cycles per instruction retired; indicating how much time each executed instruction took; in units of cycles. Often this metric shows how efficiently applications are using the underlying hardware. A lower CPI could indicate that instructions are not hitting bottlenecks and retiring quickly.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={cpi} />
                </Grid>
              </Grid>
              <Grid container>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    CPU Operating Frequency (in GHz)
                  </Typography>
                  <Typography variant="body1">
                    This is the speed of the CPU clock. Higher frequencies allow faster execution. Usually servers are able to change their frequency based on utilization to conserve energy or turbo for short periods of time to boost performance.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={cpu_freq} />
                </Grid>
              </Grid>
            </TabPanel>
            <TabPanel
              value={systemTabs}
              index={tabIndex.memory}
            >
              <Grid container style={{ borderBottom: "1px solid rgba(0, 0, 0, 0.1)", paddingBottom: "24px" }}>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    Memory Bandwidth
                  </Typography>
                  <Typography variant="body1">
                    Here, DDR memory bandwidth is broken down into reads, writes and total (read + write) in MB/sec.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={memory} />
                </Grid>
              </Grid>
              <Grid container style={{ borderBottom: "1px solid rgba(0, 0, 0, 0.1)", paddingBottom: "24px" }}>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    Remote DRAM reads %
                  </Typography>
                  <Typography variant="body1">
                    The memory reads that miss the last level cache (LLC) and are addressed to remote DRAM as a percentage of total memory read accesses. This does not include LLC prefetches.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={numa} />
                </Grid>
              </Grid>
              <Grid container>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    Cache MPI (misses per instruction)
                  </Typography>
                  <Typography variant="body1">
                    The ratio of the number of requests missing cache to the total number of completed instructions, at each level of cache (L1d, L2 and LLC)
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={cache} />
                </Grid>
              </Grid>
            </TabPanel>
            <TabPanel
              value={systemTabs}
              index={tabIndex.power}
            >
              <Grid container style={{ borderBottom: "1px solid rgba(0, 0, 0, 0.1)", paddingBottom: "24px" }}>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    Package Power
                  </Typography>
                  <Typography variant="body1">
                    The amount of power, in watts, consumed by the CPU package on the system. We provide this metric primarily for determining if system performance is being adversely affected by power throttling, although it can also be used to calculate energy consumption.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={package_power} />
                </Grid>
              </Grid>
              <Grid container style={{ borderBottom: "1px solid rgba(0, 0, 0, 0.1)", paddingBottom: "24px" }}>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    DRAM Power
                  </Typography>
                  <Typography variant="body1">
                    The amount of power, in watts, consumed by the DRAM on the system. We provide this metric primarily for determining if system performance is being adversely affected by power throttling, although it can also be used to calculate energy consumption.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={dram_power} />
                </Grid>
              </Grid>
              <Grid container>
                <Grid item xs={5}>
                  <Typography variant="h2">
                    Core C6 State Residency Percentage
                  </Typography>
                  <Typography variant="body1">
                    The average percentage of time the cores spent in the C6 low power state. C6 is a deep core idle state where the core's internal clocks are stopped and the core voltage is reduced. This state saves more power than lighter C-states, but it takes longer to enter and exit, which can impact performance if the core needs to become active again quickly.
                  </Typography>
                </Grid>
                <Grid item xs={7}>
                  <ReactECharts style={{ minHeight: "250px" }} option={c6_core} />
                </Grid>
              </Grid>
            </TabPanel>
            <TabPanel
              value={systemTabs}
              index={tabIndex.allMetrics}
            >
              <TextField 
                id="outlined-basic" 
                onChange={diffreport} 
                inputProps={{ accept: '.html' }} 
                fullWidth 
                label="Compare with other *_metrics_summary.html" 
                InputLabelProps={{ shrink: true }} 
                sx={{ paddingBottom: "24px" }} 
                type="file" 
                variant="outlined" 
              />
              <MetricsTable 
                data={current_metrics}
                showComparison={true}
                containerStyle={{ width: "fit-content" }}
              />
            </TabPanel>
            {hasGroups &&
              <TabPanel
                value={systemTabs}
                index={tabIndex.groupMetrics}
              >
                <GroupMeansTable
                  groupByField={group_by_field}
                  groups={groups}
                  groupMeans={group_means}
                  groupConfigs={group_configs}
                  groupMeta={group_meta}
                  description={description}
                  containerViewMode={containerViewMode}
                  setContainerViewMode={setContainerViewMode}
                  infoTooltipProps={infoTooltipProps}
                />
              </TabPanel>
            }
            <TabPanel
              value={systemTabs}
              index={tabIndex.systemSummary}
            >
            <TableContainer component={Paper} sx={{ width: "fit-content" }}>
                <Table size="small" style={{ tableLayout: 'auto' }}>
                  <TableHead>
                    <TableRow>
                      <TableCell>Key</TableCell>
                      <TableCell>Value</TableCell>
                    </TableRow>
                  </TableHead>
                  <TableBody>
                    {system_summary && system_summary.map(([key, value]) => (
                      <TableRow key={key}>
                      <TableCell sx={{ fontFamily: 'Monospace' }} component="th" scope="row" >
                        {JSON.stringify(key)}
                      </TableCell>
                      <TableCell sx={{ fontFamily: 'Monospace' }} align="left">
                        {JSON.stringify(value)}
                      </TableCell>
                      </TableRow>
                    ))}
                  </TableBody>
                </Table>
              </TableContainer>
            </TabPanel>
            <TabPanel
              value={systemTabs}
              index={tabIndex.metadata}
            >
            <TableContainer component={Paper} sx={{ width: "fit-content" }}>
                <Table size="small" style={{ tableLayout: 'auto' }}>
                  <TableHead>
                    <TableRow>
                      <TableCell>Key</TableCell>
                      <TableCell>Value</TableCell>
                    </TableRow>
                  </TableHead>
                  <TableBody>
                    {metadata && Object.entries(metadata).sort(([key1], [key2]) => key1.localeCompare(key2)).map(([key, value]) => (
                      <TableRow key={key}>
                      <TableCell sx={{ fontFamily: 'Monospace' }} component="th" scope="row" >
                        {JSON.stringify(key)}
                      </TableCell>
                      <TableCell sx={{ fontFamily: 'Monospace' }} align="left">
                        {JSON.stringify(value)}
                      </TableCell>
                      </TableRow>
                    ))}
                  </TableBody>
                </Table>
              </TableContainer>
            </TabPanel>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ThemeProvider theme={theme}>
        {/* CssBaseline kickstart an elegant, consistent, and simple baseline to build upon. */}
        <CssBaseline />
        <App />
      </ThemeProvider>
    );
  </script>
</body>

</html>
